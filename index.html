<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UniDoc Editor</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#212529">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- 💥 替换为本地脱机的 SVG 图标 -->
    <link rel="apple-touch-icon" href="./icon.svg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav id="top-navbar" class="navbar navbar-expand navbar-dark bg-dark flex-shrink-0 px-2 px-md-3 shadow-sm">
        <div class="container-fluid p-0">
            <button class="btn text-white d-md-none border-0 px-2 me-1" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas">
                <i class="fa-solid fa-bars fs-5"></i>
            </button>
            <a class="navbar-brand fs-6 fs-md-5 text-truncate fw-bold" href="#"><i class="fa-solid fa-book-journal-whills me-2"></i><span class="d-none d-sm-inline">UniDoc</span></a>
            
            <div class="d-flex align-items-center ms-auto">
                <button id="btn-toggle-preview" class="btn btn-sm btn-outline-info me-2 d-none">
                    <i class="fa-solid fa-eye"></i><span class="btn-text d-none d-md-inline ms-1">预览</span>
                </button>

                <span id="save-status" class="text-white-50 me-2 me-md-3 small">
                    <i class="fa-solid fa-cloud me-1"></i><span class="d-none d-md-inline">已保存</span>
                </span>
                
                <button id="btn-save" class="btn btn-sm btn-success me-2" title="Ctrl+S / Cmd+S">
                    <i class="fa-solid fa-floppy-disk"></i><span class="d-none d-md-inline ms-1">保存</span>
                </button>

                <div class="dropdown me-2">
                    <button class="btn btn-sm btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" title="导出文件">
                        <i class="fa-solid fa-file-export"></i><span class="d-none d-md-inline ms-1">导出</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow" style="min-width: 160px; font-size: 14px;">
                        <li><a class="dropdown-item" href="#" id="btn-export-md"><i class="fa-solid fa-file-code me-2 text-primary"></i>存为 本地文档</a></li>
                        <li><a class="dropdown-item" href="#" id="btn-export-html"><i class="fa-brands fa-html5 me-2 text-warning"></i>存为 HTML 网页</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" id="btn-export-pdf"><i class="fa-solid fa-file-pdf me-2 text-danger"></i>打印 / 存为 PDF</a></li>
                    </ul>
                </div>

                <div class="dropdown me-2">
                    <button class="btn btn-sm btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="fa-solid fa-palette"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow" style="min-width: 140px; font-size: 14px;">
                        <li><h6 class="dropdown-header">整体主题</h6></li>
                        <li><a class="dropdown-item theme-mode-btn" href="#" data-mode="light"><i class="fa-regular fa-sun me-2 text-warning"></i>浅色模式</a></li>
                        <li><a class="dropdown-item theme-mode-btn" href="#" data-mode="dark"><i class="fa-solid fa-moon me-2 text-primary"></i>暗黑模式</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><h6 class="dropdown-header">顶栏颜色</h6></li>
                        <li><a class="dropdown-item theme-nav-btn" href="#" data-color="bg-dark"><i class="fa-solid fa-circle text-dark me-2 border rounded-circle"></i>极简黑</a></li>
                        <li><a class="dropdown-item theme-nav-btn" href="#" data-color="bg-primary"><i class="fa-solid fa-circle text-primary me-2"></i>科技蓝</a></li>
                        <li><a class="dropdown-item theme-nav-btn" href="#" data-color="bg-success"><i class="fa-solid fa-circle text-success me-2"></i>护眼绿</a></li>
                    </ul>
                </div>
                
                <button id="btn-settings" class="btn btn-sm btn-outline-light" title="GitHub 授权">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- 主体工作区 -->
    <div class="workspace d-flex flex-grow-1 overflow-hidden position-relative">
        
        <div class="offcanvas-md offcanvas-start bg-body-tertiary border-end d-flex flex-column" tabindex="-1" id="sidebarOffcanvas" style="width: 260px;">
            <div class="offcanvas-header border-bottom d-md-none py-2 bg-body-tertiary">
                <h6 class="offcanvas-title fw-bold text-body-secondary"><i class="fa-solid fa-folder-tree me-1"></i> /notes</h6>
                <div>
                    <button id="btn-new-file-mobile" class="btn btn-sm btn-link text-body-secondary p-0 me-3"><i class="fa-solid fa-plus fs-5"></i></button>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarOffcanvas"></button>
                </div>
            </div>
            
            <div class="sidebar-header p-2 border-bottom bg-body-tertiary fw-bold text-body-secondary d-none d-md-flex justify-content-between align-items-center">
                <span><i class="fa-solid fa-folder-tree me-1"></i> /notes 目录</span>
                <div>
                    <button id="btn-new-file-pc" class="btn btn-sm btn-link text-body-secondary p-0 me-2" title="新建文件"><i class="fa-solid fa-plus"></i></button>
                    <button id="btn-refresh-tree-pc" class="btn btn-sm btn-link text-body-secondary p-0" title="刷新"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
            </div>
            
            <div id="file-tree" class="file-tree flex-grow-1 overflow-auto p-2">
                <div class="text-muted small p-2">正在加载文件...</div>
            </div>
        </div>

        <div class="main-content d-flex flex-column flex-grow-1 overflow-hidden position-relative">
            
            <!-- 编辑器工具栏 (升级了 Flex 布局，隔离了左右区域) -->
            <div id="editor-toolbar" class="bg-body-tertiary border-bottom p-1 d-flex align-items-center justify-content-between" style="display: none !important;">
                
                <!-- 左侧：根据不同语言动态切换的工具 -->
                <div class="d-flex align-items-center">
                    <div id="toolbar-md" class="d-none align-items-center">
                        <button class="btn btn-sm btn-outline-secondary border-0 py-0 px-2" data-action="bold"><i class="fa-solid fa-bold"></i></button>
                        <button class="btn btn-sm btn-outline-secondary border-0 py-0 px-2" data-action="italic"><i class="fa-solid fa-italic"></i></button>
                        <button class="btn btn-sm btn-outline-secondary border-0 py-0 px-2" data-action="link"><i class="fa-solid fa-link"></i></button>
                        <button class="btn btn-sm btn-outline-secondary border-0 py-0 px-2" data-action="image"><i class="fa-regular fa-image"></i></button>
                        <button class="btn btn-sm btn-outline-secondary border-0 py-0 px-2" data-action="code"><i class="fa-solid fa-code"></i></button>
                        
                        <span class="border-end mx-1" style="height: 18px;"></span>
                        
                        <div class="dropdown">
                            <button class="btn btn-sm btn-outline-secondary border-0 py-0 px-2" type="button" data-bs-toggle="dropdown" data-bs-display="static" data-bs-auto-close="outside">
                                <i class="fa-regular fa-face-smile"></i>
                            </button>
                            <div class="dropdown-menu p-2 shadow char-picker-panel" id="emoji-panel"></div>
                        </div>

                        <div class="dropdown">
                            <button class="btn btn-sm btn-outline-secondary border-0 py-0 px-2 fw-bold" type="button" data-bs-toggle="dropdown" data-bs-display="static" data-bs-auto-close="outside">
                                Ω
                            </button>
                            <div class="dropdown-menu p-2 shadow char-picker-panel" id="symbol-panel"></div>
                        </div>
                    </div>
                    
                    <div id="toolbar-code" class="d-none align-items-center">
                        <button class="btn btn-sm btn-outline-primary py-0 px-2" data-action="format" style="font-size: 13px;">
                            <i class="fa-solid fa-wand-magic-sparkles me-1"></i>自动排版
                        </button>
                    </div>
                </div>

                <!-- 🌟 右侧：全局数据安全中心 -->
                <div class="d-flex align-items-center border-start ps-2">
                    <button class="btn btn-sm btn-outline-info border-0 py-0 px-2 me-1" id="btn-view-clipboard" title="查看当前剪贴板内容">
                        <i class="fa-solid fa-clipboard-check"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger border-0 py-0 px-2" id="btn-shred-clipboard" title="粉碎系统剪贴板 (防止隐私窃取)">
                        <i class="fa-solid fa-broom"></i>
                    </button>
                </div>
            </div>

            <!-- Monaco 与 左侧虚拟摇杆滑轨 -->
            <div class="position-relative flex-grow-1 w-100 d-flex">
                <div id="editor-container" class="flex-grow-1 w-100"></div>
                
                <!-- 左侧边缘专属安全摇杆区 -->
                <div id="left-scroll-zone" class="position-absolute top-0 start-0 h-100" style="width: 45px; z-index: 5; touch-action: none; border-right: 1px dashed rgba(128,128,128,0.2);">
                    <!-- 极细进度条 -->
                    <div id="left-progress-bar" class="position-absolute bg-secondary opacity-25" style="width: 2px; right: 21px; top: 0; transition: transform 0.05s linear;"></div>
                    
                    <!-- 🌟 升级版大号摇杆把手 -->
                    <div id="left-joystick-thumb" class="position-absolute bg-primary rounded-pill opacity-50 shadow-sm d-flex justify-content-center align-items-center" style="width: 32px; height: 52px; right: 6px; top: 50%; transform: translateY(-50%); transition: opacity 0.2s;">
                        <!-- 箭头垂直拉伸 1.5 倍，更具推杆感 -->
                        <i class="fa-solid fa-arrows-up-down text-white" style="font-size: 16px; transform: scaleY(1.5);"></i>
                    </div>
                </div>
            </div>
            
            <div id="preview-container" class="preview-panel bg-body d-none position-absolute top-0 start-0 w-100 h-100 overflow-auto p-3 p-md-5" style="z-index: 10;">
                <div id="markdown-preview" class="markdown-body mx-auto" style="max-width: 800px;"></div>
            </div>
        </div>
    </div>

    <!-- 弹窗组件 -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999;"></div>

    <div class="modal fade" id="tokenModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header text-bg-dark border-0">
                    <h5 class="modal-title fs-6"><i class="fa-brands fa-github me-2"></i>GitHub 授权</h5>
                </div>
                <div class="modal-body bg-body">
                    <div class="mb-3">
                        <label class="form-label small text-body-secondary">Repository (拥有者/仓库名)</label>
                        <input type="text" id="input-repo" class="form-control form-control-sm" placeholder="如: myname/myrepo">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-body-secondary">Personal Access Token</label>
                        <input type="password" id="input-token" class="form-control form-control-sm" placeholder="ghp_xxxx">
                    </div>
                </div>
                <div class="modal-footer p-1 border-top-0 bg-body">
                    <button type="button" class="btn btn-sm btn-primary w-100" id="btn-save-token">保存配置并连接</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="newFileModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-body-tertiary">
                    <h5 class="modal-title fs-6">新建文件</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body bg-body">
                    <div class="mb-2">
                        <label class="form-label small text-body-secondary">文件名称 (无需输入后缀)</label>
                        <div class="input-group">
                            <input type="text" id="input-new-filename" class="form-control" placeholder="例如: config">
                            <button class="btn btn-outline-secondary dropdown-toggle bg-body-tertiary" type="button" data-bs-toggle="dropdown" id="btn-new-ext-display">.md</button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item ext-select-item" href="#" data-ext=".md">.md (Markdown)</a></li>
                                <li><a class="dropdown-item ext-select-item" href="#" data-ext=".json">.json (JSON)</a></li>
                                <li><a class="dropdown-item ext-select-item" href="#" data-ext=".yaml">.yaml (YAML)</a></li>
                                <li><a class="dropdown-item ext-select-item" href="#" data-ext=".txt">.txt (纯文本)</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="modal-footer p-1 bg-body">
                    <button type="button" class="btn btn-sm btn-primary w-100" id="btn-confirm-new">确认创建</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="renameFileModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-body-tertiary">
                    <h5 class="modal-title fs-6">重命名文件</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body bg-body">
                    <div class="mb-2">
                        <label class="form-label small text-body-secondary">新文件名称 (不包含后缀)</label>
                        <div class="input-group">
                            <input type="text" id="input-rename-filename" class="form-control">
                            <span class="input-group-text bg-body-tertiary" id="input-rename-ext">.md</span>
                        </div>
                        <input type="hidden" id="input-rename-oldpath">
                        <input type="hidden" id="input-rename-sha">
                    </div>
                </div>
                <div class="modal-footer p-1 bg-body">
                    <button type="button" class="btn btn-sm btn-primary w-100" id="btn-confirm-rename">确认重命名</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 查看剪贴板 Modal -->
    <div class="modal fade" id="clipboardModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-body-tertiary">
                    <h5 class="modal-title fs-6"><i class="fa-solid fa-user-secret me-2"></i>剪贴板内存快照</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body bg-body p-2">
                    <textarea id="clipboard-content-view" class="form-control bg-dark text-success font-monospace" rows="5" readonly style="font-size: 13px;"></textarea>
                </div>
                <div class="modal-footer p-1 bg-body justify-content-between">
                    <span class="small text-muted ps-2">如果包含敏感数据，请立即粉碎</span>
                    <div>
                        <button type="button" class="btn btn-sm btn-danger me-1" id="btn-modal-shred"><i class="fa-solid fa-broom me-1"></i>立刻粉碎</button>
                        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">关闭</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 全局 Loading -->
    <div id="global-loader" class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-75 d-none justify-content-center align-items-center" style="z-index: 1055;">
        <div class="text-center text-white">
            <div class="spinner-border mb-2" role="status"></div>
            <div id="global-loader-text" class="fs-6">处理中...</div>
        </div>
    </div>

    <!-- 依赖 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-base64/base64.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.40.0/min/vs/loader.min.js"></script>

    <!-- 🌟 我们自己的业务逻辑脚本 (注意：charPicker 必须放在 editor.js 前面) -->
    <script src="toast.js"></script>
    <script src="modal.js"></script>
    <script src="token.js"></script>
    <script src="api.js"></script>
    <script src="charPicker.js"></script>
    <script src="clipboardManager.js"></script> <!-- 新增：剪贴板与图床管家 --> 
    <script src="exportManager.js"></script> <!-- 新增：导出中心 -->
    <script src="editor.js"></script>
    <script src="fileTree.js"></script>
    <script src="main.js"></script>
</body>
</html>
